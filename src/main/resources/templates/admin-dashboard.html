<!DOCTYPE html><html><head><title>Admin Dashboard</title><style>body{font-family:Arial;margin:0;background:#f3f4f6}.head{background:#111827;color:white;padding:20px 5%;display:flex;justify-content:space-between}.wrap{width:90%;margin:30px auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px}.card{background:white;padding:20px;border-radius:10px}.num{font-size:32px;font-weight:bold}.links a{display:inline-block;margin:18px 10px 0 0;padding:12px 16px;background:#2563eb;color:#fff;text-decoration:none;border-radius:6px}</style></head><body><div class="head"><b>Bank Clearing Control Center</b><a href="/logout" style="color:white">Logout</a></div><div class="wrap"><h1>Clearing Dashboard</h1><div class="cards"><div class="card">Total<div class="num" th:text="${total}"></div></div><div class="card">Submitted<div class="num" th:text="${submitted}"></div></div><div class="card">Approved<div class="num" th:text="${approved}"></div></div><div class="card">Rejected<div class="num" th:text="${rejected}"></div></div><div class="card">Cleared<div class="num" th:text="${cleared}"></div></div><div class="card">Fraud Flags<div class="num" th:text="${fraud}"></div></div></div><div class="links"><a href="/admin/cheques">Review Cheques</a><a href="/admin/audit">Audit Log</a><a href="/admin/report">Download PDF Report</a></div></div></body></html>

<!DOCTYPE html><html><head><title>Customer Dashboard</title><style>body{font-family:Arial;margin:0;background:#f4f6f8}.head{background:#2563eb;color:white;padding:20px 6%;display:flex;justify-content:space-between}.wrap{width:88%;margin:30px auto}.cards{display:flex;gap:18px;flex-wrap:wrap}.card{background:white;padding:25px;border-radius:12px;min-width:220px;box-shadow:0 2px 10px #ddd}.btn{display:inline-block;padding:10px 15px;background:#2563eb;color:white;text-decoration:none;border-radius:6px}.notice{background:#fff7ed;padding:15px;border-radius:8px;margin:15px 0}</style></head><body><div class="head"><b>Customer Dashboard</b><a href="/logout" style="color:white">Logout</a></div><div class="wrap"><h2>Welcome, <span th:text="${user.username}"></span></h2><p>Unread notifications: <b th:text="${unread}"></b></p><div th:each="n:${notifications}" class="notice" th:text="${n.message}"></div><div class="cards"><div class="card"><h3>Submit Cheque</h3><p>Start a new clearing request.</p><a class="btn" href="/submit-cheque">Submit</a></div><div class="card"><h3>Track Cheques</h3><p>Search your cheques and follow their status.</p><a class="btn" href="/my-cheques">My Cheques</a></div></div></div></body></html>

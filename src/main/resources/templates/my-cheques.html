<!DOCTYPE html><html><head><title>My Cheques</title><style>body{font-family:Arial;background:#f4f6f8;padding:30px}.bar{background:white;padding:18px;border-radius:10px;margin-bottom:20px}table{width:100%;background:white;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}.badge{font-weight:bold}</style></head><body><h1>My Cheques</h1><div class="bar"><form><input name="q" th:value="${q}" placeholder="Search cheque, bank, account"><select name="status"><option value="">All statuses</option><option>SUBMITTED</option><option>IN_REVIEW</option><option>APPROVED</option><option>REJECTED</option><option>CLEARED</option></select><button>Filter</button></form></div><table><tr><th>Cheque</th><th>Bank</th><th>Amount</th><th>Date</th><th>Clearing Bank</th><th>Status</th></tr><tr th:each="c:${cheques}"><td th:text="${c.chequeNumber}"></td><td th:text="${c.bankName}"></td><td th:text="${c.amount}"></td><td th:text="${c.chequeDate}"></td><td th:text="${c.clearingBank}"></td><td class="badge" th:text="${c.status}"></td></tr></table><p><a href="/customer-dashboard">Dashboard</a></p></body></html>

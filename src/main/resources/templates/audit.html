<!DOCTYPE html><html><head><title>Audit Log</title><style>body{font-family:Arial;background:#f4f6f8;padding:30px}table{width:100%;background:white;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd}</style></head><body><h1>Audit / Transaction History</h1><table><tr><th>Time</th><th>User</th><th>Action</th><th>Cheque</th><th>Details</th></tr><tr th:each="l:${logs}"><td th:text="${l.timestamp}"></td><td th:text="${l.username}"></td><td th:text="${l.action}"></td><td th:text="${l.chequeId}"></td><td th:text="${l.details}"></td></tr></table><p><a href="/admin-dashboard">Dashboard</a></p></body></html>

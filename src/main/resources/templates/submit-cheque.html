<!DOCTYPE html><html><head><title>Submit Cheque</title><style>body{font-family:Arial;background:#f4f6f8}.box{width:600px;margin:40px auto;background:white;padding:30px;border-radius:12px}label{display:block;margin-top:12px;font-weight:bold}input,button{width:100%;padding:11px;box-sizing:border-box;margin-top:5px}button{margin-top:20px;background:#2563eb;color:white;border:0;border-radius:6px}.err{color:#b91c1c}</style></head><body><div class="box"><h1>Submit Cheque</h1><p class="err" th:if="${error}" th:text="${error}"></p><form method="post"><label>Cheque Number</label><input name="chequeNumber" required><label>Account Number</label><input name="accountNumber" required><label>Amount</label><input name="amount" type="number" step="0.01" min="0.01" required><label>Drawer Bank</label><input name="bankName" required><label>Clearing/Payee Bank</label><input name="clearingBank" required><label>Cheque Date</label><input name="chequeDate" type="date" required><button>Submit for Clearing</button></form><p><a href="/customer-dashboard">Back</a></p></div></body></html>

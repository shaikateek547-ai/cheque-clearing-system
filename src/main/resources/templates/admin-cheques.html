<!DOCTYPE html><html><head><title>Cheque Review</title><style>body{font-family:Arial;background:#f3f4f6;padding:25px}table{width:100%;background:#fff;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;vertical-align:top}.flag{color:#b91c1c;font-weight:bold}input,select,button{padding:7px;margin:2px}form{display:inline}.reject{width:130px}</style></head><body><h1>Cheque Review & Clearing Workflow</h1><form><input name="q" th:value="${q}" placeholder="Search cheque/bank/account"><select name="status"><option value="">All</option><option>SUBMITTED</option><option>IN_REVIEW</option><option>APPROVED</option><option>REJECTED</option><option>CLEARED</option></select><button>Filter</button></form><table><tr><th>Cheque</th><th>Customer</th><th>Route</th><th>Amount</th><th>Status</th><th>Risk</th><th>Action</th></tr><tr th:each="c:${cheques}"><td th:text="${c.chequeNumber}"></td><td th:text="${c.submittedBy.username}"></td><td th:text="${c.bankName+' → '+c.clearingBank}"></td><td th:text="${c.amount}"></td><td th:text="${c.status}"></td><td><span th:if="${c.fraudFlag}" class="flag">FLAGGED: <span th:text="${c.fraudReason}"></span></span><span th:unless="${c.fraudFlag}">Normal</span></td><td><form method="post" th:action="@{'/admin/cheques/'+${c.id}+'/decision'}"><button name="decision" value="RETURN">Review</button><button name="decision" value="APPROVE">Approve</button><button name="decision" value="CLEAR">Clear</button><input class="reject" name="reason" placeholder="Rejection reason"><button name="decision" value="REJECT">Reject</button></form></td></tr></table><p><a href="/admin-dashboard">Dashboard</a></p></body></html>
